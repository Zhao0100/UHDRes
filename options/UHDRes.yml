name: UHDRes_4k_dehaze
model_type: ImageCleanModel
scale: &upscale 1
num_gpu: 4 # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: General_Image_Train
    type: PairedImageDataset
    dataroot_gt: ~
    dataroot_lq: ~

    io_backend:
      type: disk

    gt_size: 512
    use_resize_crop: False
    use_hflip: False
    use_rot: False

    # data loader
    use_shuffle: true
    geometric_augs: True
    batch_size_per_gpu: &bsz 1
    num_worker_per_gpu: 12
    dataset_enlarge_ratio: 1

    prefetch_mode: cpu
    num_prefetch_queue: *bsz

  val:
    name: General_Image_Valid
    type: PairedImageDataset
    dataroot_gt: ~
    dataroot_lq: ~
    gt_size: 512
    io_backend:
      type: disk
    geometric_augs: True
    use_resize_crop: False
    use_flip: False
    use_rot: False

# network structures
network_g:
  type: UHDRes

# path
path:
  pretrain_network_hq: ~
  pretrain_network_g: ~
  pretrain_network_d: ~
  strict_load: false
  resume_state: ~


# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 5e-4
    weight_decay: !!float 1e-3
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [10, 500000]
    restart_weights: [1, 1]
    eta_mins: [0.0005, 0.000001]

  total_iter: 500000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: !!float 0.1

  net_d_iters: 0
  net_d_init_iters: !!float 0

# validation settings·
val:
  val_freq: !!float 5000
  save_img: false

  key_metric: psnr
  metrics:
    psnr: # metric name, can be arbitrary
      type: psnr
      crop_border: 1
      test_y_channel: true
      color_space: ycbcr
    ssim:
      type: ssim
      crop_border: 1
      test_y_channel: true
      color_space: ycbcr

logger:
  print_freq: 500
  save_checkpoint_freq: !!float 5000
  save_latest_freq: !!float 5000
  show_tf_imgs_freq: !!float 5000
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 16500 #29500
find_unused_parameters: true
